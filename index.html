<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموسوعة الإسلامية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Almarai", sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            position: relative;
            background:
                linear-gradient(180deg, rgba(3, 12, 9, 0.83), rgba(7, 30, 20, 0.86)),
                url("https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
            color: #f8f5ec;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(246, 217, 119, 0.15), transparent 35%),
                radial-gradient(circle at bottom left, rgba(129, 204, 154, 0.12), transparent 30%),
                transparent;
            pointer-events: none;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .ulParent {
            width: 35%;
            min-width: 300px;
            background: linear-gradient(180deg, rgba(12, 90, 38, 0.97), rgba(6, 57, 28, 0.98));
            border-right: 1px solid rgba(255, 215, 120, 0.35);
            box-shadow: inset -10px 0 28px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(255, 215, 120, 0.08);
        }

        .ulParent input.search {
            width: calc(100% - 24px);
            height: 60px;
            margin: 12px;
            border: 1px solid rgba(255, 215, 120, 0.72);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 0 18px rgba(246, 217, 119, 0.05), 0 10px 20px rgba(0, 0, 0, 0.12);
            color: #fff;
            text-align: right;
            font-size: 24px;
            padding: 0 18px;
            direction: rtl;
            outline: none;
        }

        .ulParent input.search::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .ulParent .mainUL {
            height: calc(100% - 84px);
            overflow-y: auto;
            scrollbar-width: none;
            padding: 8px 10px 20px;
        }

        .ulParent .mainUL li {
            list-style: none;
            width: 100%;
            min-height: 72px;
            margin: 8px 0;
            padding: 10px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(246, 217, 113, 0.14), rgba(255, 255, 255, 0.04));
            border: 1px solid rgba(255, 215, 120, 0.38);
            color: #f9d870;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .ulParent .mainUL li:hover {
            background: linear-gradient(135deg, rgba(255, 215, 120, 0.25), rgba(255, 255, 255, 0.06));
            transform: translateY(-1px);
        }

        .ulParent .mainUL li.active {
            background: linear-gradient(135deg, rgba(255, 215, 120, 0.28), rgba(255, 255, 255, 0.08));
            border-color: rgba(255, 215, 120, 0.7);
        }

        .content {
            width: 65%;
            display: grid;
            grid-template-rows: auto 1fr;
            background: rgba(255, 250, 239, 0.04);
            overflow: hidden;
        }

        .content .hero {
            padding: 22px 26px 18px;
            border-bottom: 1px solid rgba(255, 215, 120, 0.35);
            background: linear-gradient(180deg, rgba(13, 46, 27, 0.9), rgba(8, 35, 21, 0.95));
            box-shadow: inset 0 -10px 20px rgba(0, 0, 0, 0.08), 0 12px 24px rgba(0, 0, 0, 0.14);
        }

        .content .hero h1 {
            text-align: center;
            font-size: clamp(28px, 3vw, 42px);
            color: #f6d977;
            margin-bottom: 12px;
        }

        .content .hero p {
            text-align: center;
            color: #f4efe2;
            font-size: 18px;
            line-height: 1.8;
        }

        .hero-tools {
            display: flex;
            justify-content: center;
            margin-top: 18px;
        }

        .theme-toggle {
            border: 1px solid rgba(255, 215, 120, 0.52);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 18px;
            border-radius: 999px;
            padding: 10px 18px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.12);
        }

        .content-area {
            overflow-y: auto;
            padding: 24px;
            scrollbar-width: none;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        }

        .overview-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }

        .overview-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 215, 120, 0.25);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
        }

        .overview-card h3 {
            color: #f6d977;
            text-align: center;
            margin-bottom: 12px;
            font-size: 26px;
        }

        .overview-card p,
        .overview-card li {
            color: #f5efe5;
            line-height: 1.8;
            text-align: right;
            font-size: 18px;
        }

        .overview-card ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prayer-method {
            width: 100%;
            min-height: 44px;
            margin-top: 10px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 215, 120, 0.35);
            border-radius: 12px;
            background: rgba(7, 23, 17, 0.72);
            color: #f5e9c8;
            font-size: 15px;
            direction: rtl;
        }

        .prayer-load {
            width: 100%;
            min-height: 44px;
            margin-top: 10px;
            padding: 9px 14px;
            border: 1px solid rgba(214, 176, 98, 0.55);
            border-radius: 12px;
            background: rgba(214, 176, 98, 0.14);
            color: #f3dfaf;
            font-size: 16px;
            cursor: pointer;
        }

        .prayer-load:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .prayer-status {
            margin-top: 10px;
            color: #f5efe5;
            font-size: 14px;
            line-height: 1.7;
            text-align: right;
        }

        .prayer-next {
            margin-top: 10px;
            color: #f6d977;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
        }

        .prayer-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .prayer-time {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 9px 10px;
            border: 1px solid rgba(255, 215, 120, 0.16);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: #f5efe5;
            font-size: 14px;
        }

        .overview-card .mini-label {
            display: inline-block;
            color: #f6d977;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .quick-links button,
        .favorite-button {
            border: 1px solid rgba(255, 215, 120, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .quick-links button:hover,
        .favorite-button:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.1);
        }

        .favorite-button {
            flex-shrink: 0;
            font-size: 22px;
            width: 42px;
            height: 42px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .favorite-button.active {
            background: rgba(246, 217, 119, 0.2);
            border-color: rgba(246, 217, 119, 0.8);
            color: #f6d977;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
        }

        .menu-item-title {
            flex: 1;
            text-align: center;
        }

        .theme-light {
            background: linear-gradient(rgba(249, 244, 231, 0.8), rgba(249, 244, 231, 0.8)), url("https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
            color: #183f2a;
        }

        .theme-light .ulParent {
            background: linear-gradient(180deg, rgba(236, 244, 216, 0.96), rgba(198, 222, 181, 0.96));
            border-right-color: rgba(35, 92, 64, 0.38);
            box-shadow: inset -10px 0 28px rgba(0, 0, 0, 0.08);
        }

        .theme-light .mainUL li,
        .theme-light .card,
        .theme-light .overview-card,
        .theme-light .article-box,
        .theme-light .smart-rosary {
            border-color: rgba(19, 92, 55, 0.25);
            box-shadow: 0 8px 16px rgba(14, 48, 25, 0.08);
        }

        .theme-light .smart-rosary {
            background: linear-gradient(180deg, rgba(221, 234, 214, 0.92), rgba(202, 224, 191, 0.92));
        }

        .theme-light .content .hero,
        .theme-light .content {
            background: rgba(255, 255, 255, 0.18);
        }

        .theme-light .theme-toggle,
        .theme-light .ulParent input.search,
        .theme-light .rosary-select,
        .theme-light .prayer-method,
        .theme-light .prayer-load,
        .theme-light .quick-links button,
        .theme-light .favorite-button {
            background: rgba(20, 95, 45, 0.08);
            color: #183f2a;
            border-color: rgba(20, 95, 45, 0.28);
        }

        .theme-light .mainUL li,
        .theme-light .card li,
        .theme-light .article-box,
        .theme-light .overview-card p,
        .theme-light .overview-card li,
        .theme-light .card p {
            color: #183f2a;
        }

        .theme-light .content .hero h1,
        .theme-light .card h3,
        .theme-light .overview-card h3,
        .theme-light .prayer-next,
        .theme-light .rosary-header,
        .theme-light .rosary-target,
        .theme-light .rosary-message {
            color: #144c2b;
        }

        .theme-light .prayer-status,
        .theme-light .prayer-time {
            color: #183f2a;
        }

        .theme-light .prayer-time {
            background: rgba(20, 95, 45, 0.04);
            border-color: rgba(20, 95, 45, 0.16);
        }

        .theme-light .rosary-number {
            color: #183f2a;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
            border: 1px solid rgba(255, 215, 120, 0.25);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.15), inset 0 0 18px rgba(255,255,255,0.02);
        }

        .card h3 {
            color: #f6d977;
            font-size: 26px;
            margin-bottom: 12px;
            text-align: center;
        }

        .card ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card li {
            color: #f5efe5;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 10px 12px;
            text-align: right;
            line-height: 1.7;
            font-size: 18px;
        }

        .card p {
            color: #f5efe5;
            line-height: 1.9;
            text-align: right;
            font-size: 18px;
        }

        .article-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 120, 0.18);
            border-radius: 16px;
            padding: 18px;
            margin-top: 18px;
            color: #f5efe5;
            line-height: 1.9;
            font-size: 22px;
            text-align: right;
        }

        .smart-rosary {
            background: linear-gradient(180deg, rgba(12, 34, 25, 0.96), rgba(7, 23, 17, 0.98));
            border: 1px solid rgba(214, 176, 98, 0.5);
            border-radius: 22px;
            padding: 20px 18px 16px;
            margin-bottom: 20px;
            box-shadow: 0 18px 34px rgba(0, 0, 0, 0.26), inset 0 0 30px rgba(214, 176, 98, 0.05);
        }

        .rosary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            color: #ead39a;
            font-size: 28px;
            font-weight: 700;
        }

        .rosary-counter {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
        }

        .rosary-btn {
            width: 72px;
            height: 72px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #f0d185, #c9922f);
            color: #122d1f;
            font-size: 38px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 22px rgba(192, 145, 58, 0.34), inset 0 0 12px rgba(255,255,255,0.2);
        }

        .rosary-btn:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .rosary-number {
            min-width: 150px;
            text-align: center;
            font-size: clamp(40px, 5vw, 64px);
            color: #f8eed0;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(240, 209, 133, 0.2);
        }

        .rosary-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .rosary-select {
            flex: 1;
            min-width: 200px;
            height: 52px;
            border-radius: 18px;
            border: 1px solid rgba(214, 176, 98, 0.48);
            background: linear-gradient(135deg, rgba(17, 41, 31, 0.92), rgba(9, 21, 16, 0.92));
            color: #f5e9c8;
            font-size: 20px;
            padding: 0 48px 0 18px;
            outline: none;
            direction: rtl;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, #e9d39b 50%), linear-gradient(135deg, #e9d39b 50%, transparent 50%);
            background-position: calc(100% - 22px) calc(50% - 2px), calc(100% - 16px) calc(50% - 2px);
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 0 1px rgba(214, 176, 98, 0.08);
            cursor: pointer;
        }

        .rosary-select option {
            background: #183f2a;
            color: #fff;
            padding: 12px;
        }

        .rosary-reset {
            width: auto;
            min-width: 110px;
            height: 52px;
            font-size: 22px;
            padding: 0 18px;
            background: rgba(15, 34, 26, 0.9);
            border: 1px solid rgba(214, 176, 98, 0.45);
            color: #f3dfaf;
        }

        .rosary-target {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            color: #f1e7cc;
            font-size: 18px;
        }

        .target-bar {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 120, 0.2);
        }

        .target-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d7ae61, #8dc7a0);
            border-radius: 20px;
            transition: width 0.2s ease;
            box-shadow: 0 0 12px rgba(214, 176, 98, 0.28);
        }

        .rosary-message {
            margin-top: 12px;
            text-align: center;
            color: #f3dfaf;
            font-size: 18px;
            min-height: 30px;
        }

        @media (max-width: 980px) {
            body {
                overflow-x: hidden;
                overflow-y: auto;
            }

            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .ulParent,
            .content {
                width: 100%;
            }

            .ulParent {
                min-width: 0;
                max-height: none;
            }

            .ulParent .mainUL {
                height: auto;
                overflow-y: visible;
            }

            .content {
                min-height: 0;
                overflow: visible;
                display: block;
            }

            .content-area {
                overflow: visible;
            }
        }

        @media (max-width: 680px) {
            .ulParent {
                position: sticky;
                top: 0;
                z-index: 5;
                padding-top: env(safe-area-inset-top);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
            }

            .ulParent input.search {
                width: calc(100% - 24px);
                height: 50px;
                margin: 10px 12px 6px;
                border-radius: 15px;
                font-size: 18px;
            }

            .ulParent .mainUL {
                display: flex;
                gap: 8px;
                height: auto;
                padding: 6px 12px 12px;
                overflow-x: auto;
                overflow-y: hidden;
                scrollbar-width: thin;
                overscroll-behavior-x: contain;
                -webkit-overflow-scrolling: touch;
            }

            .ulParent .mainUL li {
                flex: 0 0 auto;
                width: auto;
                min-height: 46px;
                margin: 0;
                padding: 6px 10px;
                border-radius: 14px;
                font-size: 15px;
                white-space: nowrap;
            }

            .menu-item {
                gap: 6px;
            }

            .menu-item-title {
                flex: 0 0 auto;
            }

            .favorite-button {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }

            .content .hero {
                padding: 22px 16px 18px;
            }

            .content .hero h1 {
                font-size: clamp(25px, 7vw, 34px);
                margin-bottom: 8px;
            }

            .content .hero p {
                font-size: 15px;
                line-height: 1.7;
            }

            .hero-tools {
                margin-top: 12px;
            }

            .theme-toggle {
                min-height: 44px;
                font-size: 16px;
                padding: 8px 16px;
            }

            .content-area {
                padding: 14px;
                padding-bottom: calc(20px + env(safe-area-inset-bottom));
            }

            .overview-panel,
            .cards-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 12px;
            }

            .overview-card,
            .card {
                padding: 15px;
            }

            .overview-card h3,
            .card h3 {
                font-size: 21px;
            }

            .overview-card p,
            .overview-card li,
            .card p,
            .card li {
                font-size: 16px;
            }

            .article-box {
                margin-top: 12px;
                padding: 14px;
                font-size: 18px;
            }

            .smart-rosary {
                border-radius: 18px;
                padding: 16px 13px 13px;
            }

            .rosary-header {
                font-size: 21px;
                margin-bottom: 12px;
            }

            .rosary-counter {
                gap: 12px;
            }

            .rosary-btn {
                width: 58px;
                height: 58px;
                border-radius: 15px;
                font-size: 30px;
            }

            .rosary-number {
                min-width: 0;
                flex: 1;
                font-size: clamp(36px, 11vw, 52px);
            }

            .rosary-actions {
                align-items: stretch;
            }

            .rosary-select {
                min-width: 0;
                width: 100%;
                flex-basis: 100%;
                height: 48px;
                font-size: 16px;
            }

            .rosary-reset {
                min-width: 96px;
                height: 46px;
                font-size: 17px;
            }

            .rosary-target,
            .rosary-message {
                font-size: 15px;
            }
        }

        @media (max-width: 380px) {
            .content-area {
                padding: 10px;
            }

            .rosary-counter {
                gap: 8px;
            }

            .rosary-btn {
                width: 52px;
                height: 52px;
            }
        }
    </style>
</head>
<body class="theme-dark">
    <div class="container">
        <aside class="ulParent">
            <input type="text" class="search" placeholder="ابحث في الموسوعة" aria-label="Search">
            <ul class="mainUL" id="categoryList"></ul>
        </aside>

        <main class="content">
            <div class="hero">
                <h1>الموسوعة الإسلامية</h1>
                <p>مرجع شامل في العقيدة، الفقه، التفسير، السيرة، الأذكار، والعبادات، بأسلوب بسيط وواضح.</p>
                <div class="hero-tools">
                    <button class="theme-toggle" type="button" aria-label="تبديل الوضع">الوضع الليلي</button>
                </div>
            </div>
            <div class="content-area" id="contentArea"></div>
        </main>
    </div>

    <script>
        const categoryList = document.getElementById('categoryList');
        const contentArea = document.getElementById('contentArea');
        const THEME_STORAGE_KEY = 'islamicEncyclopediaTheme';
        const FAVORITES_STORAGE_KEY = 'islamicEncyclopediaFavorites';
        const PRAYER_METHOD_STORAGE_KEY = 'islamicEncyclopediaPrayerMethod';
        const prayerNames = [
            { key: 'Fajr', label: 'الفجر' },
            { key: 'Dhuhr', label: 'الظهر' },
            { key: 'Asr', label: 'العصر' },
            { key: 'Maghrib', label: 'المغرب' },
            { key: 'Isha', label: 'العشاء' }
        ];

        const dailyReminders = [
            { title: 'ذكر اليوم', text: 'من ذكر الله في قلبه، استنار به قلبه، ومن نسيه ضلّ عن طريقه.' },

        function getPrayerMethod() {
            const availableMethods = ['1', '2', '3', '4', '5'];
            const savedMethod = localStorage.getItem(PRAYER_METHOD_STORAGE_KEY) || '3';
            return availableMethods.includes(savedMethod) ? savedMethod : '3';
        }

        function setPrayerStatus(message) {
            const status = document.getElementById('prayerStatus');
            if (status) status.textContent = message;
        }

        function parsePrayerTime(value) {
            const match = typeof value === 'string' ? value.match(/(\d{1,2}):(\d{2})/) : null;
            if (!match) return null;
            return Number(match[1]) * 60 + Number(match[2]);
        }

        function updatePrayerDetails() {
            const details = document.getElementById('prayerDetails');
            if (!details) return;
            details.replaceChildren();

            if (!prayerTimesState) return;

            const list = document.createElement('div');
            list.className = 'prayer-list';

            prayerNames.forEach(prayer => {
                const row = document.createElement('div');
                row.className = 'prayer-time';
                const name = document.createElement('span');
                name.textContent = prayer.label;
                const time = document.createElement('strong');
                time.textContent = prayerTimesState.timings[prayer.key];
                row.append(name, time);
                list.appendChild(row);
            });

            const nextPrayer = document.createElement('p');
            nextPrayer.className = 'prayer-next';
            const clock = new Intl.DateTimeFormat('en-GB', {
                timeZone: prayerTimesState.timezone,
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            });
            const currentParts = clock.formatToParts(new Date());
            const currentHour = Number(currentParts.find(part => part.type === 'hour').value);
            const currentMinute = Number(currentParts.find(part => part.type === 'minute').value);
            const currentTotalMinutes = currentHour * 60 + currentMinute;
            const upcoming = prayerNames
                .map(prayer => ({
                    ...prayer,
                    timeInMinutes: parsePrayerTime(prayerTimesState.timings[prayer.key])
                }))
                .filter(prayer => prayer.timeInMinutes !== null)
                .map(prayer => ({
                    ...prayer,
                    minutesUntil: (prayer.timeInMinutes - currentTotalMinutes + 1440) % 1440
                }))
                .sort((first, second) => first.minutesUntil - second.minutesUntil)[0];

            if (upcoming) {
                const hours = Math.floor(upcoming.minutesUntil / 60);
                const minutes = upcoming.minutesUntil % 60;
                nextPrayer.textContent = `الصلاة القادمة: ${upcoming.label} — ${hours} س ${minutes} د`;
            }

            details.append(list);
            if (nextPrayer.textContent) details.append(nextPrayer);
        }

        async function loadPrayerTimes(latitude, longitude) {
            const methodSelect = document.getElementById('prayerMethod');
            const loadButton = document.getElementById('loadPrayerTimes');
            if (!methodSelect || !loadButton) return;

            loadButton.disabled = true;
            setPrayerStatus('جارٍ تحميل مواقيت الصلاة...');
            try {
                const method = methodSelect.value;
                const endpoint = new URL('https://api.aladhan.com/v1/timings');
                endpoint.searchParams.set('latitude', latitude);
                endpoint.searchParams.set('longitude', longitude);
                endpoint.searchParams.set('method', method);

                const response = await fetch(endpoint);
                if (!response.ok) {
                    throw new Error(`تعذر الاتصال بخدمة المواقيت (HTTP ${response.status}).`);
                }

                const result = await response.json();
                const data = result.data;
                if (result.code !== 200 || !data?.timings || !data?.meta?.timezone) {
                    throw new Error('استجابت خدمة المواقيت ببيانات غير مكتملة.');
                }

                prayerTimesState = {
                    timings: data.timings,
                    timezone: data.meta.timezone,
                    date: data.date?.readable || ''
                };
                setPrayerStatus(`${prayerTimesState.date ? `${prayerTimesState.date} · ` : ''}${prayerTimesState.timezone}`);
                updatePrayerDetails();
                if (prayerCountdownTimer) clearInterval(prayerCountdownTimer);
                prayerCountdownTimer = setInterval(updatePrayerDetails, 60000);
            } catch (error) {
                setPrayerStatus(error instanceof Error ? error.message : 'تعذر تحميل مواقيت الصلاة.');
            } finally {
                loadButton.disabled = false;
            }
        }

        function bindPrayerTimes() {
            const methodSelect = document.getElementById('prayerMethod');
            const loadButton = document.getElementById('loadPrayerTimes');
            if (!methodSelect || !loadButton) return;

            methodSelect.value = getPrayerMethod();
            methodSelect.addEventListener('change', () => {
                localStorage.setItem(PRAYER_METHOD_STORAGE_KEY, methodSelect.value);
                if (prayerCoordinates) {
                    loadPrayerTimes(prayerCoordinates.latitude, prayerCoordinates.longitude);
                }
            });

            loadButton.addEventListener('click', () => {
                if (!navigator.geolocation) {
                    setPrayerStatus('المتصفح لا يدعم تحديد الموقع. افتح الصفحة عبر HTTPS أو استخدم متصفحاً حديثاً.');
                    return;
                }

                loadButton.disabled = true;
                setPrayerStatus('بانتظار إذن الموقع...');
                navigator.geolocation.getCurrentPosition(
                    position => {
                        prayerCoordinates = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };
                        loadPrayerTimes(prayerCoordinates.latitude, prayerCoordinates.longitude);
                    },
                    error => {
                        const messages = {
                            1: 'لم يتم السماح بالوصول إلى الموقع. اسمح للموقع باستخدام موقعك ثم أعد المحاولة.',
                            2: 'تعذر تحديد موقعك. تحقق من إعدادات الموقع وحاول مرة أخرى.',
                            3: 'انتهت مهلة تحديد الموقع. حاول مرة أخرى.'
                        };
                        setPrayerStatus(messages[error.code] || 'تعذر تحديد موقعك.');
                        loadButton.disabled = false;
                    },
                    { enableHighAccuracy: false, timeout: 15000, maximumAge: 300000 }
                );
            });

            if (prayerTimesState) {
                setPrayerStatus(`${prayerTimesState.date ? `${prayerTimesState.date} · ` : ''}${prayerTimesState.timezone}`);
                updatePrayerDetails();
            }
        }

            if (toggleBtn) {

            }
        }

            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'dark';

            }

                    { title: 'الزواج', text: 'الزواج سُنّة مَحْمودة يهدف إلى استقرار الأسرة وتنشئة الأبناء.' },
                    { title: 'المعاملات', text: 'تشمل البيع، الربا، المعاوضات، والإحسان في التعامل مع الناس.' }
                ]
            },
            {
                id: 'history',
                title: 'السيرة والرحلة',
                items: [
                    { title: 'مولد النبي محمد صلى الله عليه وسلم', text: 'وُلد في مكة المكرمة في شهر ربيع الأول، وكان يقال له: محمد، وكان اسمه محمداً قبل البعثة، وولد في بيت كريم من قريش، وكان أبوه عبد الله مات قبل مولده، وكانت أمه آمنة بنت وهب تربيه في طفولته بحنان ووقار.' },
                    { title: 'نشأته في مكة', text: 'نشأ النبي صلى الله عليه وسلم في مكة بين آبائه وأهله، وكان معروفاً بالصدق والأمانة، وكان يُعرف في قومه باسم الأمين، وكان محبباً إلى الناس، واشتغل بالرعي في صباه ثم أصبح عهداً مع خديجة رضي الله عنها في التجارة.' },
                    { title: 'الرسالة والنبوة', text: 'عندما بلغ الأربعين من عمره، نزل عليه الوحي في غار حراء، وكان أول ما نزل: اقرأ باسم ربك الذي خلق، وبدأت الرسالة في مكة، وكان أول من آمن به خديجة رضي الله عنها، ثم أبو بكر رضي الله عنه، وصهيب، وبلال، وعمار، وسميرة، وغيرهم.' },
                    { title: 'الدعوة في مكة', text: 'دعوة النبي صلى الله عليه وسلم في مكة كانت صعبة، إذ كثر أذى المشركين، وكانوا يضربونه ويؤذونه، لكنه كان صبراً، يذكر الله، ويستمر في الدعوة، فقام ببيان التوحيد وتكذيب الشرك، وجاءت آيات كثيرة تدعو إلى الإيمان والعدل والرحمة.' },
                    { title: 'الهجرة إلى المدينة', text: 'هاجر النبي صلى الله عليه وسلم إلى المدينة المنورة مع أبي بكر رضي الله عنه بعد أن أصيب المسلمون بأذى شديد، وكانت الهجرة نقطة تحول في التاريخ الإسلامي، إذ أسست المدينة دولة إسلامية قائمة على الإيمان والعدل.' },
                    { title: 'العهد المدني', text: 'في المدينة بدأ النبي صلى الله عليه وسلم في تنظيم المجتمع، وبني المسجد النبوي، ووضع مؤسسات الشورى والعدل، وغرس روابط الأخوة بين المهاجرين والأنصار، وبدأ بناء الدولة الإسلامية على التوحيد والرحمة.' },
                    { title: 'غزواته وفتح مكة', text: 'خاض النبي صلى الله عليه وسلم غزوات عديدة، منها بدر، أحد، الخندق، مؤتة، وفتح مكة، وكانت هذه المعارك تظهر العزّة والرحمة في نفس رسول الله، فقد عفا عن كثير من أعدائه بعد الفتح، وفتح مكة في العام الثامن من الهجرة.' },
                    { title: 'خاتمة الرسالة', text: 'في العام العاشر من الهجرة، أُرسل النبي صلى الله عليه وسلم إلى الناس رسالة الإسلام كاملة، وفي نفس العام نزلت آية: اليوم أكملت لكم دينكم، وكان هذا إيذاناً بتمام الرسالة، وبيّن أن الدين الإسلامي كامل وشامل.' },
                    { title: 'الرحمة للعالمين', text: 'كان النبي صلى الله عليه وسلم رحمة للعالمين، فعلى الرغم من الصبر والنهضة، كان يرحم الصغار، ويؤدب الكبار، ويعطي للمحتاجين، ويصل الرحم، ويقول: ما نالني الضرب إلا في سبيل الله، وكان مظهراً للرفق والحياء والرحمة.' },
                    { title: 'أخلاقه', text: 'كانت أخلاق النبي صلى الله عليه وسلم عظيمة: الصدق، الأمانة، الحلم، الشجاعة، الوفاء، العفو، الصبر، والرحمة، وهو القدوة في كل شيء، من الصلاة إلى القول والعمل، ومن العدل إلى المعاملة.' },
                    { title: 'الصحابة', text: 'كان صحابة النبي صلى الله عليه وسلم خير أمة، وقد آمنوا به، جاهدوا معه، وكتبوا السنة من أقواله وأفعاله، وهم من مشهد المدينة ومكة والذين رافقوا رسول الله في السفر والحرب والهدنة.' },
                    { title: 'الخلفاء الراشدون', text: 'بعد وفاة النبي صلى الله عليه وسلم، قام أبو بكر الصديق، ثم عمر بن الخطاب، ثم عثمان بن عفان، ثم علي بن أبي طالب رضي الله عنهم، وغرسوا منهج التوحيد والعدل، وأسسوا الدولة الإسلامية في أبعادها السياسية والشرعية.' },
                    { title: 'الرسالة الخالدة', text: 'لا تزال سيرة النبي صلى الله عليه وسلم حيّة في قلوب المؤمنين، فهي مصدر نور، وهدى، ورحمة، وتعلّم لا تنتهي، ومن يقرأ سيرته يفهم كيف يُحسن الإنسان أن يكون عابدًا، أخًا، زعيمًا، وقائدًا.' }
                ]
            },
            {
                id: 'ethics',
                title: 'الأخلاق',
                items: [
                    { title: 'الصدق', text: 'الصدق يفتح القلوب، ويقوي المجتمع، ويُشيد الثقة بين الناس.' },
                    { title: 'الرحمة', text: 'رحمة الله في الأرض تُظهر في تعاملات المسلم مع خلق الله.' },
                    { title: 'الصبر', text: 'الصبر من أعظم خصال المؤمن، خاصة في الأزمات والشدائد.' },
                    { title: 'الحياء', text: 'الحياء يمنع المسلم من المعاصي ويصون عرضه وكرامته.' }
                ]
            }
        ];

        function getSelectedDhikrTarget() {
            const option = rosaryOptions.find(item => item.label === selectedDhikr) || rosaryOptions[0];
            return option.target;
        }

        function updateRosaryStatus() {
            const target = getSelectedDhikrTarget();
            const progress = Math.min((rosaryCount / target) * 100, 100);
            const messageEl = document.getElementById('rosaryMessage');
            const targetFill = document.getElementById('targetFill');

            if (targetFill) {
                targetFill.style.width = `${progress}%`;
            }

            saveRosaryState();

            if (messageEl) {
                if (rosaryCount === 0) {
                    messageEl.textContent = 'ابدأ بذكر الله وبارك في وقتك.';
                } else if (rosaryCount < target) {
                    messageEl.textContent = `${rosaryCount} / ${target} تم العد حتى الآن.`;
                } else {
                    messageEl.textContent = 'تم الوصول إلى العدد المطلوب، بارك الله فيك.';
                }
            }
        }

        function renderRosaryWidget() {
            const target = getSelectedDhikrTarget();
            const progress = Math.min((rosaryCount / target) * 100, 100);

            return `
                <div class="smart-rosary">
                    <div class="rosary-header">
                        <span>المسبحة الذكية</span>
                        <span style="font-size:20px; color:#fff4cc;">${selectedDhikr}</span>
                    </div>

                    <div class="rosary-counter">
                        <button class="rosary-btn" data-action="minus" aria-label="Decrease count">−</button>
                        <div class="rosary-number" id="rosaryNumber">${rosaryCount}</div>
                        <button class="rosary-btn" data-action="plus" aria-label="Increase count">+</button>
                    </div>

                    <div class="rosary-actions">
                        <select class="rosary-select" id="rosarySelect">
                            ${rosaryOptions.map(option => `
                                <option value="${option.label}" ${option.label === selectedDhikr ? 'selected' : ''}>${option.label}</option>
                            `).join('')}
                        </select>
                        <button class="rosary-btn rosary-reset" data-action="reset" aria-label="Reset count">إعادة</button>
                    </div>

                    <div class="rosary-target">
                        <span>الهدف: ${target}</span>
                        <span>${rosaryCount} / ${target}</span>
                    </div>

                    <div class="target-bar">
                        <div class="target-fill" id="targetFill" style="width: ${progress}%;"></div>
                    </div>

                    <div class="rosary-message" id="rosaryMessage">ابدأ بذكر الله وبارك في وقتك.</div>
                </div>
            `;
        }

        function bindRosaryEvents() {
            const plusBtn = document.querySelector('[data-action="plus"]');
            const minusBtn = document.querySelector('[data-action="minus"]');
            const resetBtn = document.querySelector('[data-action="reset"]');
            const selectEl = document.getElementById('rosarySelect');

            if (plusBtn) {
                plusBtn.addEventListener('click', () => {
                    rosaryCount += 1;
                    updateRosaryStatus();
                    const numberEl = document.getElementById('rosaryNumber');
                    if (numberEl) numberEl.textContent = rosaryCount;
                    const targetLabel = document.querySelector('.rosary-target span:last-child');
                    if (targetLabel) {
                        const target = getSelectedDhikrTarget();
                        targetLabel.textContent = `${rosaryCount} / ${target}`;
                    }
                });
            }

            if (minusBtn) {
                minusBtn.addEventListener('click', () => {
                    rosaryCount = Math.max(0, rosaryCount - 1);
                    updateRosaryStatus();
                    const numberEl = document.getElementById('rosaryNumber');
                    if (numberEl) numberEl.textContent = rosaryCount;
                    const targetLabel = document.querySelector('.rosary-target span:last-child');
                    if (targetLabel) {
                        const target = getSelectedDhikrTarget();
                        targetLabel.textContent = `${rosaryCount} / ${target}`;
                    }
                });
            }

            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    rosaryCount = 0;
                    updateRosaryStatus();
                    const numberEl = document.getElementById('rosaryNumber');
                    if (numberEl) numberEl.textContent = rosaryCount;
                    const targetLabel = document.querySelector('.rosary-target span:last-child');
                    if (targetLabel) {
                        const target = getSelectedDhikrTarget();
                        targetLabel.textContent = `${rosaryCount} / ${target}`;
                    }
                });
            }

            if (selectEl) {
                selectEl.addEventListener('change', (event) => {
                    const state = getRosaryState();
                    state[selectedDhikr] = rosaryCount;
                    selectedDhikr = event.target.value;
                    rosaryCount = state[selectedDhikr] ?? 0;
                    const widget = renderRosaryWidget();
                    const currentSmartRosary = document.querySelector('.smart-rosary');
                    if (currentSmartRosary) {
                        currentSmartRosary.outerHTML = widget;
                        bindRosaryEvents();
                        saveRosaryState();
                    }
                });
            }
        }

        function bindQuickActions() {
            document.querySelectorAll('[data-quick-section]').forEach(button => {
                button.addEventListener('click', () => {
                    renderSection(button.getAttribute('data-quick-section'));
                });
            });
            bindPrayerTimes();
        }

        function renderCards(items) {
            return `
                <div class="cards-grid">
                    ${items.map(item => `
                        <article class="card">
                            <h3>${item.title}</h3>
                            <p>${item.text}</p>
                        </article>
                    `).join('')}
                </div>
            `;
        }

        function normalizeSearchText(value) {
            return value
                .toLowerCase()
                .replace(/[إأآا]/g, 'ا')
                .replace(/[ة]/g, 'ة')
                .replace(/[ى]/g, 'ي')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function searchCategories(value) {
            const rawValue = value.trim();
            if (!rawValue) {
                renderSection('intro');
                return;
            }

            const normalized = normalizeSearchText(rawValue);
            const searchTerms = normalized.split(' ').filter(Boolean);

            const filtered = encyclopedia
                .map(section => {
                    const matchingItems = section.items.filter(item => {
                        const title = normalizeSearchText(item.title);
                        const text = normalizeSearchText(item.text);
                        const sectionTitle = normalizeSearchText(section.title);

                        return searchTerms.every(term =>
                            sectionTitle.includes(term) ||
                            title.includes(term) ||
                            text.includes(term)
                        );
                    });

                    return {
                        ...section,
                        items: matchingItems
                    };
                })
                .filter(section => section.items.length > 0 || normalizeSearchText(section.title).includes(normalized));

            if (!filtered.length) {
                contentArea.innerHTML = `
                    ${renderRosaryWidget()}
                    ${renderQuickTools()}
                    <div class="article-box">
                        <h3 style="color:#f6d977; margin-bottom: 12px;">لا توجد نتائج</h3>
                        <p>جرب كلمات مثل: الصلاة، القرآن، الصبر، التوحيد، الحج، الأذكار</p>
                    </div>
                `;
                bindRosaryEvents();
                bindQuickActions();
                return;
            }

            contentArea.innerHTML = `
                ${renderRosaryWidget()}
                ${renderQuickTools()}
                ${filtered.map(section => `
                    <div class="article-box">
                        <h3 style="color:#f6d977; margin-bottom: 12px;">${section.title}</h3>
                        ${renderCards(section.items)}
                    </div>
                `).join('')}
            `;
            bindRosaryEvents();
            bindQuickActions();
        }

        function renderSection(id) {
            const section = encyclopedia.find(item => item.id === id) || encyclopedia[0];
            activeSectionId = section.id;
            contentArea.innerHTML = `
                ${renderRosaryWidget()}
                ${renderQuickTools()}
                <div class="article-box">
                    <h3 style="color:#f6d977; margin-bottom: 12px;">${section.title}</h3>
                    ${renderCards(section.items)}
                </div>
            `;
            bindRosaryEvents();
            bindQuickActions();
        }

        function populateMenu() {
            categoryList.innerHTML = '';
            const favorites = new Set(getFavorites());

            encyclopedia.forEach(section => {
                const li = document.createElement('li');
                li.className = `menu-item ${activeSectionId === section.id ? 'active' : ''}`;

                const title = document.createElement('span');
                title.className = 'menu-item-title';
                title.textContent = section.title;

                const favoriteBtn = document.createElement('button');
                favoriteBtn.type = 'button';
                favoriteBtn.className = `favorite-button ${favorites.has(section.id) ? 'active' : ''}`;
                favoriteBtn.setAttribute('aria-label', favorites.has(section.id) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة');
                favoriteBtn.textContent = favorites.has(section.id) ? '★' : '☆';
                favoriteBtn.addEventListener('click', (event) => {
                    event.stopPropagation();
                    toggleFavorite(section.id);
                });

                li.appendChild(title);
                li.appendChild(favoriteBtn);
                li.addEventListener('click', () => renderSection(section.id));
                categoryList.appendChild(li);
            });
        }

        document.querySelector('.search').addEventListener('input', (event) => {
            searchCategories(event.target.value);
        });

        setupThemeToggle();
        loadRosaryState();
        populateMenu();
        renderSection('intro');
    </script>
</body>
</html>
