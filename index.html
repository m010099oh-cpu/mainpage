         * {
            padding: 0;

            font-family: "Almarai", sans-serif;
         }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        body .mainDiv {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        body .mainDiv .ulParent {
            width: 100%;
            height: 50%;
            overflow: scroll;
            scrollbar-width: none;
            background-color: white;
            border-radius: 0px 0px 20px 20px;
            resize: vertical;
            max-height: 50%;
        }
        body .mainDiv .ulParent ul li a {
            text-decoration: none;
            color: rgb(255, 253, 253);
            margin-left: 10px;
            width: 100%;
        }
        body .mainDiv .ulParent ul {
            width: 100%;
            height: 100%;
            background-color: rgba(252, 252, 252, 0.564);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            overflow: scroll;
            scrollbar-width: none;
        }
        body .mainDiv .content {
            width: 100%;
            overflow-y: scroll;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            background-image: url(./—Pngtree—islamic\ background\ with\ mandala\ motif_1965455.png);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            scrollbar-width: 5px;
            
        }
        body .mainUL :where(li) {
            width: 90%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50px;
            background-color: rgb(0, 128, 0);
        }
        body .mainUL li :where(h2,a) {
            font-size: 30px;
            font-weight: 1300;
            height: 50px;
            text-align: center;
            background-image: linear-gradient(to right, yellow, gold 65%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body .content ul {
            width: 100%;
            height: 100%;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        body .content ul div {
            
            font-size: 30px;
            background-color: rgb(255, 238, 216);
            padding: 20px;
            border-right: rgb(1, 91, 1) sodivd 10px;
            border-radius: 0px 15px 15px 0px;
            box-shadow: 0px 0px 20px 5px gray;
            width: 70%;
            direction: rtl;
            display: flex;
            justify-content: space-between;
            height: 70px;
        }
        body .content ul .adhkar {
            flex-direction: column;
        }
        body .content ul .adhkar p {
            background-color: rgba(0, 128, 0, 0.512);
            color: white;
            width: fit-content;
            height: fit-content;
            padding: 3px;
            border-radius: 30px;
            font-size: 20px;
            gap: 10px;
        }
        body .content button {
